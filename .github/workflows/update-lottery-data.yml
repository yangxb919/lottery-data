name: Update lottery data

on:
  schedule:
    # UTC 14:05 = Beijing 22:05.
    # Draw days only: SSQ Sun/Tue/Thu; DLT Mon/Wed/Sat. Friday is skipped.
    - cron: "5 14 * * 0,1,2,3,4,6"
  workflow_dispatch:
    inputs:
      lottery:
        description: "Lottery to update"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - ssq
          - dlt

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Fetch and merge lottery data
        run: python scripts/update_lottery_data.py --lottery "${{ inputs.lottery || 'all' }}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No lottery data changes."
          else
            git commit -m "Update lottery data"
            git push
          fi
