name: Update lottery data

on:
  schedule:
    # UTC 14:05 = Beijing 22:05. Covers SSQ 21:15 and DLT 20:30 draw days.
    - cron: "5 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and merge lottery data
        run: python scripts/update_lottery_data.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No lottery data changes."
          else
            git commit -m "Update lottery data"
            git push
          fi
